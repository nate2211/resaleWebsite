# Build-only configuration consumed by @cloudflare/vite-plugin.
#
# The installed Miniflare/workerd build supports compatibility dates through
# 2026-05-22. The deploy-facing wrangler.toml intentionally remains the exact
# assets-only SPA configuration requested by the project owner.
name = "audiomasterlab-vinext-build"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[assets]
not_found_handling = "single-page-application"

[browser]
binding = "BROWSER"
remote = true

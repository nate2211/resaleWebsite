# Full-stack Vinext configuration used by @cloudflare/vite-plugin during
# development and production builds.
#
# Vinext 0.0.50 exports this App Router Worker entry directly. Using the
# package entry here prevents a custom worker file from being traversed by the
# RSC client-reference analysis pass.
name = "audiomasterlab-vinext-build"
main = "vinext/server/app-router-entry"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
not_found_handling = "none"

[browser]
binding = "BROWSER"
remote = true
